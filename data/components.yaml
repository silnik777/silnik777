meta:
  description: >
    Rejestr składników gazu: nazwy CoolProp, stechiometria wody (do wartości
    opałowej) oraz molowe ciepło spalania gazu doskonałego przy 25°C wg
    ISO 6976:2016, tab. 3. Wartości HHV zweryfikowane krzyżowo z entalpiami
    tworzenia (ATcT/CODATA, pakiet chemicals 1.5.2) — odchyłki < 0,03%.
  updated: "2026-06-11"
  source: "ISO 6976:2016 (tab. 3); CoolProp 7.2 (nazwy płynów)"

