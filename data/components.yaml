# Stałe metody ISO 6976
iso6976_constants:
  # Entalpia parowania wody przy 25°C [kJ/mol] — różnica Hs−Hi na 1 mol H2O.
  h2o_vaporization_25c_kj_per_mol: 44.016
  h2o_vaporization_source: >
    ISO 6976 (spójna z parami wartości brutto/netto tab. 3); rozrzut źródeł
    44,004–44,016 kJ/mol (CODATA) ⇒ wpływ na Hi < 0,03%.
  # Masa molowa suchego powietrza [kg/kmol] — do gęstości względnej.
  air_molar_mass_kg_per_kmol: 28.9626
  air_source: "ISO 6976:2016"
