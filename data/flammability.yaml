meta:
  description: >
    Granice wybuchowości składników palnych w powietrzu (LEL/UEL, % obj.)
    do wyznaczania granic mieszaniny regułą Le Chateliera (M1, moduł strat
    gazu). Wartości w temperaturze pokojowej i ciśnieniu atmosferycznym;
    rosną/maleją z temperaturą (screening — do weryfikacji dla warunków
    procesowych). Składniki niepalne (N2, CO2, O2, He, Ar) pominięte.
  updated: "2026-07-06"
  source: >
    NFPA 497 / ISO 10156 / CRC Handbook; wartości orientacyjne (screening).

limits_vol_pct_in_air:
