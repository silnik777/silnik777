meta:
  description: >
    Scenariusze cenowe (niski/bazowy/wysoki) do 2050: nośniki energii
    [PLN/MWh wg wartości opałowej], uprawnienia EU ETS i ETS2 [EUR/t CO2]
    oraz emisyjność miksu elektroenergetycznego PL [t CO2/MWh].
    Punkty kotwiczne interpolowane liniowo. WSZYSTKIE wartości orientacyjne —
    rzędy wielkości z rynku 2024/25 i publicznych trajektorii (IEA WEO,
    KOBiZE, notowania EUA); do regularnej aktualizacji i edycji w UI.
    Scenariusze użytkownika: zapis do data/user_scenarios/*.json.
  updated: "2026-06-11"
  source: >
    Synteza: TGE (gaz, energia elektryczna — rzędy wielkości 2024/25);
    IEA World Energy Outlook 2024 (trajektorie); notowania EUA (ICE);
    KOBiZE — wskaźniki emisyjności energii elektrycznej; IEA Global
    Hydrogen Review (koszty H2). Wartości orientacyjne — do weryfikacji.
  note: "Wartość orientacyjna — do weryfikacji przed użyciem decyzyjnym."

defaults:
  eur_pln: 4.30
  eur_pln_source: "Kurs roboczy — do aktualizacji"

# Jednostki: nośniki energii PLN/MWh (Hi); CO2: EUR/t; miks: t CO2/MWh el.
carriers:
  gaz_ziemny:
    name_pl: "gaz ziemny (hurt, TGE)"
    unit: "PLN/MWh"
  energia_elektryczna:
    name_pl: "energia elektryczna (hurt)"
    unit: "PLN/MWh"
  wodor:
    name_pl: "wodór odnawialny (koszt dostawy)"
    unit: "PLN/MWh"
  biometan:
    name_pl: "biometan"
    unit: "PLN/MWh"
  biomasa:
    name_pl: "biomasa (zrębka)"
    unit: "PLN/MWh"
  eua:
    name_pl: "EU ETS (EUA)"
    unit: "EUR/t CO2"
  ets2:
    name_pl: "ETS2 (budynki/transport, od 2027)"
    unit: "EUR/t CO2"
  emisyjnosc_miksu:
    name_pl: "emisyjność miksu elektroenergetycznego PL"
    unit: "t CO2/MWh"

