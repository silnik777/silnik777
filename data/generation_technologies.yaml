meta:
  description: >
    Biblioteka technologii wytwarzania ciepła i energii elektrycznej (M7) —
    benchmark od paliw kopalnych po bezemisyjne. Sprawności wg wartości
    opałowej (Hi); dla pomp ciepła "sprawność cieplna" = COP sezonowy.
    Wartości orientacyjne wg katalogów Danish Energy Agency (Technology
    Data for Generation of Electricity and District Heating / Individual
    Heating), IEA WEO oraz danych producentów — do weryfikacji.
    Technologie cieplne zasilają listę źródeł podgrzewu w M13.
  updated: "2026-06-11"
  source: "Danish Energy Agency Technology Data (2023/24); IEA WEO 2024"
  note: "Wartość orientacyjna — do weryfikacji."

