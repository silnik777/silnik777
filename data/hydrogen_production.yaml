meta:
  description: >
    Biblioteka technologii produkcji wodoru (M6): elektrolizery AEL/PEM/
    SOEC/AEM, SMR+CCS, piroliza metanu. Wartości orientacyjne wg IEA Global
    Hydrogen Review 2023/2024 i IEA "The Future of Hydrogen" (2019),
    uzupełnione DNV Hydrogen Forecast 2022 — do weryfikacji ofertami.
    Zużycie energii odniesione do 1 kg H2 (Hi(H2) = 33,33 kWh/kg).
  updated: "2026-06-11"
  source: "IEA Global Hydrogen Review 2023/2024; IEA 2019; DNV 2022"
  note: "Wartość orientacyjna — do weryfikacji."

technologies:
  AEL:
    name_pl: "elektroliza alkaliczna (AEL)"
    electricity_kwh_per_kg: {min: 50.0, typical: 52.0, max: 56.0}
    fuel_gas_kwh_per_kg: 0.0
    water_l_per_kg: {min: 9.0, typical: 15.0, max: 22.0}
    part_load_pct: [15, 100]
    degradation_pct_per_year: {min: 0.25, typical: 0.5, max: 1.0}
    stack_lifetime_h: [60000, 90000]
    capex_eur_per_kw_el: {min: 800, typical: 1000, max: 1400}
    opex_pct_capex_per_year: 3.0
    pressure_out_bar: 30.0
    purity_pct: 99.9
    purity_note: "Po doczyszczeniu (deoxo+osuszanie): 99,999%"
    direct_co2_kg_per_kg_h2: 0.0
    trl: 9
    source: "IEA GHR 2023 (system, BoP włącznie)"
