meta:
  description: >
    Biblioteka typowych składów biometanu jako strumienia domieszki (M1).
    Udziały molowe w %. Modele SUCHE (bez H2O/H2S/NH3 — poza zakresem
    GERG-2008; zakładamy gaz po uzdatnianiu/osuszaniu). Składy orientacyjne —
    do zastąpienia analizą rzeczywistą instalacji.
  updated: "2026-07-06"

